<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}人事評価システム{% endblock %}</title>
    <style>
        :root {
            --bg: #f4f1ea;
            --card: #fffdf8;
            --line: #d7cdbf;
            --text: #2b251f;
            --accent: #245c4f;
            --accent-soft: #e1eee9;
            --soft: #f8fbf9;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Yu Gothic UI", sans-serif;
            color: var(--text);
            background: linear-gradient(135deg, #efe8da 0%, #f7f4ee 100%);
        }
        .container {
            width: min(1200px, calc(100% - 32px));
            margin: 32px auto;
        }
        .container.evaluation-layout {
            width: min(2520px, calc(100% - 32px));
        }
        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(60, 46, 22, 0.08);
        }
        .card.evaluation-layout {
            overflow-x: auto;
        }
        h1, h2, h3 { margin-top: 0; }
        nav {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            align-items: center;
        }
        nav a, .button {
            text-decoration: none;
            color: white;
            background: var(--accent);
            padding: 10px 16px;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        nav form { margin: 0; }
        .button-secondary {
            background: var(--accent-soft);
            color: var(--accent);
        }
        form p { margin-bottom: 16px; }
        label {
            display: block;
            font-weight: 700;
            margin-bottom: 6px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fff;
            font: inherit;
        }
        textarea { resize: vertical; }
        ul.messages {
            list-style: none;
            padding: 0;
            margin: 0 0 16px;
        }
        ul.messages li {
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 8px;
            background: #edf7f3;
            border: 1px solid #b9d8cc;
        }
        .grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        }
        .menu-item {
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: #fff;
        }
        .meta {
            color: #6b6257;
            font-size: 14px;
        }
        .year-chip {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 12px;
            border-radius: 999px;
            background: var(--soft);
            border: 1px solid #dce8e2;
            font-size: 13px;
            color: var(--accent);
        }
        .entry-header {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(320px, 420px);
            gap: 20px;
            align-items: start;
            margin-bottom: 16px;
        }
        .entry-header-main {
            min-width: 0;
        }
        .shared-note-panel {
            padding: 18px;
            border-radius: 16px;
            border: 1px solid #dce8e2;
            background: var(--soft);
        }
        .shared-note-title {
            margin-bottom: 8px;
            font-size: 18px;
        }
        .shared-note-panel textarea {
            min-height: 132px;
            background: #fff;
        }
        .shared-note-meta {
            margin-top: 8px;
            font-size: 12px;
            color: #6b6257;
            text-align: right;
        }
        .field-errors {
            margin-top: 8px;
            color: #a53f2b;
            font-size: 13px;
        }
        .goal-grid {
            display: grid;
            gap: 16px;
            grid-template-columns: 1fr;
            margin-top: 20px;
        }
        .goal-pair {
            display: grid;
            grid-template-columns: minmax(360px, 1.15fr) minmax(420px, 1.35fr);
            gap: 16px;
            align-items: stretch;
        }
        .goal-column {
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 10px;
            align-self: stretch;
        }
        .goal-heading {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
        }
        .goal-reference,
        .goal-input {
            padding: 16px;
            border-radius: 14px;
            border: 1px solid var(--line);
            min-height: 220px;
            height: 100%;
        }
        .goal-reference {
            background: var(--soft);
            border-color: #dce8e2;
        }
        .goal-input {
            background: #fff;
        }
        .goal-input label { display: none; }
        .goal-input textarea {
            min-height: 180px;
            border: none;
            border-radius: 0;
            background: transparent;
            padding: 0;
            box-shadow: none;
        }
        .achievement-table {
            display: grid;
            gap: 12px;
            margin-top: 20px;
        }
        .achievement-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1.1fr;
            gap: 16px;
            align-items: stretch;
        }
        .achievement-cell {
            padding: 16px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: #fff;
        }
        .achievement-cell.reference {
            background: var(--soft);
            border-color: #dce8e2;
        }
        .achievement-cell textarea {
            min-height: 240px;
        }
        .evaluation-table {
            display: grid;
            gap: 12px;
            margin-top: 20px;
        }
        .evaluation-wide {
            width: min(2400px, calc(100vw - 48px));
            margin-left: 50%;
            transform: translateX(-50%);
        }
        .evaluation-row {
            display: grid;
            grid-template-columns: 1.7fr 1.7fr 1.7fr 2fr 260px;
            gap: 16px;
            align-items: stretch;
        }
        .evaluation-cell {
            padding: 16px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: #fff;
        }
        .evaluation-cell.reference {
            background: var(--soft);
            border-color: #dce8e2;
        }
        .evaluation-cell textarea {
            min-height: 208px;
        }
        .score-cell {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .score-cell input {
            min-height: 46px;
        }
        .score-cell textarea {
            min-height: 132px;
        }
        .inline-button {
            margin-top: 10px;
            width: 100%;
        }
        .bulk-ai-button {
            min-width: 200px;
        }
        .form-actions {
            margin-top: 20px;
        }
        .form-actions-top {
            display: flex;
            justify-content: flex-end;
            margin: 12px 0 16px;
        }
        .form-actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin: 12px 0 16px;
        }
        .evaluation-loading {
            display: none;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            border-radius: 16px;
            border: 1px solid #b7d5ca;
            background: linear-gradient(135deg, #edf7f3 0%, #f8fbf9 100%);
            color: var(--accent);
            font-size: 16px;
            font-weight: 700;
            margin: 8px 0 18px;
            box-shadow: 0 8px 20px rgba(36, 92, 79, 0.12);
        }
        .evaluation-loading.visible {
            display: flex;
        }
        .evaluation-loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(43, 37, 31, 0.22);
            backdrop-filter: blur(2px);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .evaluation-loading-overlay.visible {
            display: flex;
        }
        .evaluation-loading-panel {
            width: min(560px, 100%);
            background: #fffdf8;
            border: 1px solid #b7d5ca;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(43, 37, 31, 0.18);
            padding: 28px 30px;
        }
        .evaluation-loading-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .evaluation-loading-subtext {
            font-size: 14px;
            font-weight: 500;
            color: #4c6d64;
        }
        .loading-dots {
            display: inline-flex;
            gap: 6px;
        }
        .loading-dots span {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: var(--accent);
            animation: loading-bounce 1.1s infinite ease-in-out;
        }
        .loading-dots span:nth-child(2) { animation-delay: 0.15s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes loading-bounce {
            0%, 80%, 100% { transform: scale(0.7); opacity: 0.45; }
            40% { transform: scale(1); opacity: 1; }
        }
        @media (max-width: 900px) {
            .entry-header {
                grid-template-columns: 1fr;
            }
            .goal-grid {
                grid-template-columns: 1fr;
            }
            .goal-pair {
                grid-template-columns: 1fr;
            }
            .achievement-row {
                grid-template-columns: 1fr;
            }
            .evaluation-row {
                grid-template-columns: 1fr;
            }
            .form-actions-bar {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="container {% block container_class %}{% endblock %}">
        {% if user.is_authenticated %}
            <nav>
                <a href="{% url 'menu' %}">メニュー</a>
                <a href="{% url 'my_goal' %}">個人目標入力</a>
                <a href="{% url 'achievement' %}">達成状況入力</a>
                {% if user.is_manager %}
                    <a href="{% url 'year_setting' %}">設定</a>
                    <a href="{% url 'dept_goal' %}">部署目標入力</a>
                    <a href="{% url 'evaluate' %}">評価入力</a>
                {% endif %}
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="button button-secondary">ログアウト</button>
                </form>
            </nav>
        {% endif %}

        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <div class="card {% block card_class %}{% endblock %}">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
